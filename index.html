                        .replace(/{fill}/g, piece.color === 'w' ? '#ffffff' : '#222222')
                        .replace(/{stroke}/g, piece.color === 'w' ? '#000000' : '#eeeeee');
                    el.dataset.type = piece.type; el.dataset.color = piece.color;
                    if(isAnimate) { el.classList.remove('piece-pop'); void el.offsetWidth; el.classList.add('piece-pop'); }
                }

                const isReversed = reversedPawns.duration > 0 && reversedPawns.color === piece.color && piece.type === 'p';
                el.classList.toggle('piece-rooted', rootedPieces[piece.uid] > 0);
                el.classList.toggle('piece-invincible', invinciblePieces[piece.uid] > 0);
                const isBlessed = !!babyEffect && (piece.uid === babyEffect.kUid || piece.uid === babyEffect.qUid);
                el.classList.toggle('piece-blessed', isBlessed);
                el.classList.toggle('piece-reversed', isReversed);

                let duration = 0;
                if (rootedPieces[piece.uid] > 0) duration = rootedPieces[piece.uid];
                else if (invinciblePieces[piece.uid] > 0) duration = invinciblePieces[piece.uid];
                else if (isBlessed) duration = babyEffect.remaining;
                else if (piece.type === 'wall') {
                    const wallEntry = activeWalls.find(w => w.sq === sq);
                    duration = wallEntry ? wallEntry.duration : 0;
                } else if (isReversed) {
                    duration = reversedPawns.duration;
                }

                let counter = el.querySelector('.effect-counter');
                if (!counter) { counter = document.createElement('span'); counter.className = 'effect-counter'; el.appendChild(counter); }
                if (duration > 0) { counter.innerText = duration; counter.style.display = 'flex'; }
                else { counter.style.display = 'none'; }

                // 칸 하나 = 기물 크기의 100%. translate는 자기 크기 기준 %라서 (열*100%, 행*100%)
                el.dataset.square = sq; el.style.translate = `${c * 100}% ${r * 100}%`;
            }
            pieceEls.forEach((el, uid) => {
                if (currentIds.has(uid)) return;
                pieceEls.delete(uid);
                if (!muteShatter) FX.shatter(el.dataset.square, el.dataset.color);
                el.style.transform = 'scale(0) rotate(45deg)'; el.style.opacity = '0';
                setTimeout(() => el.remove(), 300);
            });
            updateFog();
        }

        function drawDots() {
            dotsLayer.innerHTML = '';
            legalMoves.forEach(move => {
                const coords = getCoords(move.to); const el = document.createElement('div');
                if (!isFogOn() && (game.get(move.to) || move.captured)) el.className = 'capture-ring'; else el.className = 'dot';
                el.style.left = `${coords.x}%`; el.style.top = `${coords.y}%`; dotsLayer.appendChild(el);
            });
            squareList.forEach(s => s.classList.remove('selected'));
            if(selectedSquare) squareEls.get(selectedSquare).classList.add('selected');
            updatePreviousMoveHighlights();
        }

        function updateProgressBar() {
            const bar = document.getElementById('augment-progress'); const txt = document.getElementById('augment-text');
            const remain = AUGMENT_INTERVAL - (moveCount % AUGMENT_INTERVAL); const pct = (moveCount % AUGMENT_INTERVAL) / AUGMENT_INTERVAL * 100;
            bar.style.width = pct + '%';
            if(remain === AUGMENT_INTERVAL && moveCount > 0) { bar.style.width = '100%'; txt.innerText = "증강 발동!"; bar.style.background = 'var(--primary)'; }
            else { txt.innerText = `증강: ${remain}수`; bar.style.background = 'linear-gradient(90deg, #ff9f43, #ee5253)'; }
        }

        function showToast(msg, color = "#fff", duration = 3000) {
            const t = document.createElement('div'); t.className = 'toast'; t.innerHTML = `<span style="color:${color}">${msg}</span>`;
            document.getElementById('toast-container').appendChild(t); setTimeout(() => { t.style.opacity = 0; t.style.transform = 'translateY(-30px) scale(0.8)'; setTimeout(() => t.remove(), 400); }, duration);
        }

        // ==========================================
        // FX 엔진 (Canvas 2D) — 파티클/충격파/번개/빛기둥/슬래시
        // 캔버스는 보드와 함께 회전하므로, '화면 기준 위쪽'은 UP()으로 계산한다.
        // ==========================================
        const FX = (() => {
            const canvas = document.getElementById('fx-canvas');
            const ctx = canvas.getContext('2d');
            let W = 0, H = 0, cell = 0, dpr = 1, running = false, last = 0;
            const parts = [], rings = [], flashes = [], bolts = [], beams = [], slashes = [], rays = [], marks = [], waves = [], dims = [];
            const lists = [parts, rings, flashes, bolts, beams, slashes, rays, marks, waves, dims];
            const rnd = (a, b) => a + Math.random() * (b - a);
            const pick = arr => arr[(Math.random() * arr.length) | 0];
            const TAU = Math.PI * 2;
            const UP = () => document.body.classList.contains('black-pov') ? 1 : -1;
            const DOWN = () => -UP();
            const rgb = c => c.join(',');
            const C = {
                orange: [255, 150, 60], red: [255, 70, 50], yellow: [255, 224, 110], white: [255, 255, 255],
                purple: [175, 105, 225], violet: [100, 45, 150], lilac: [225, 180, 255], night: [26, 14, 38],
                gold: [255, 222, 130], green: [120, 255, 170], smoke: [78, 78, 84], dust: [190, 190, 200], brick: [160, 135, 110]
            };
            const ctr = sq => { resize(); const c = getCoords(sq); return { x: (c.x + 6.25) / 100 * W, y: (c.y + 6.25) / 100 * H }; };

            function resize() {
                const w = boardEl.clientWidth, h = boardEl.clientHeight, d = Math.min(window.devicePixelRatio || 1, 2);
                if (w === W && h === H && d === dpr) return;
                W = w; H = h; dpr = d; cell = W / 8;
                canvas.width = Math.round(W * d); canvas.height = Math.round(H * d);
                ctx.setTransform(d, 0, 0, d, 0, 0);
            }
            function kick() {
                if (reduceMotion) { lists.forEach(l => l.length = 0); return; }
                resize(); if (!W) { lists.forEach(l => l.length = 0); return; }
                if (running) return;
                running = true; last = performance.now(); requestAnimationFrame(frame);
            }

            // ---------- 생성기 ----------
            function P(o) {
                if (parts.length > 520) return;
                const p = Object.assign({ x: 0, y: 0, vx: 0, vy: 0, g: 0, drag: 0, size: 3, dur: 0.6, t: 0, kind: 'glow',
                    color: C.orange, alpha: 1, grow: 0, tw: false, seed: Math.random() * 10 }, o);
                p.css = 'rgb(' + rgb(p.color) + ')'; parts.push(p);
            }
            function ring(x, y, r0, r1, color, dur, w, a = 1) { rings.push({ x, y, r0, r1, color, dur, w, a, t: 0 }); }
            function flash(x, y, r, color, dur, a = 1) { flashes.push({ x, y, r, color, dur, a, t: 0 }); }
            function beam(x, wd, color, dur) { beams.push({ x, wd, color, dur, t: 0 }); }
            function rayBurst(x, y, color, dur, len) { rays.push({ x, y, color, dur, len, n: 14, rot: rnd(0, TAU), t: 0 }); }
            function slash(x0, y0, x1, y1, color, dur, w = 5) { slashes.push({ x0, y0, x1, y1, color, dur, w, t: 0 }); }
            function makeBolt(x0, y0, x1, y1) {
                const n = 9, dx = x1 - x0, dy = y1 - y0, len = Math.hypot(dx, dy) || 1, px = -dy / len, py = dx / len;
                const pts = [];
                for (let i = 0; i <= n; i++) {
                    const f = i / n, off = (i === 0 || i === n) ? 0 : rnd(-1, 1) * cell * 0.34;
                    pts.push([x0 + dx * f + px * off, y0 + dy * f + py * off]);
                }
                const br = [];
                for (let k = 0; k < 2; k++) {
                    const i = 2 + ((Math.random() * (n - 4)) | 0), [bx, by] = pts[i], dir = Math.random() < 0.5 ? -1 : 1;
                    const seg = [[bx, by]]; let cx = bx, cy = by;
                    for (let j = 0; j < 3; j++) { cx += dir * rnd(0.15, 0.5) * cell + dx / len * cell * 0.2; cy += dy / len * cell * 0.45 + rnd(-0.2, 0.2) * cell; seg.push([cx, cy]); }
                    br.push(seg);
                }
                bolts.push({ pts, br, dur: 0.38, t: 0, w: Math.max(2, cell * 0.05) });
            }
            function embers(x, y, n, sMin, sMax, colors, g = 260, extra = {}) {
                for (let i = 0; i < n; i++) {
                    const ang = rnd(0, TAU), sp = rnd(sMin, sMax);
                    P(Object.assign({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, g: DOWN() * g, drag: 1.8,
                        size: rnd(1.5, 3.6), dur: rnd(0.45, 0.95), kind: Math.random() < 0.5 ? 'spark' : 'glow', color: pick(colors) }, extra));
                }
            }
            function puffs(x, y, n, color, alpha = 0.55) {
                for (let i = 0; i < n; i++)
                    P({ x: x + rnd(-8, 8), y: y + rnd(-8, 8), vx: rnd(-25, 25), vy: UP() * rnd(18, 60), size: rnd(cell * 0.18, cell * 0.3),
                        grow: 1.8, dur: rnd(0.8, 1.3), kind: 'smoke', color, alpha });
            }
            function rising(x, y, spread, n, colors, vMin = 40, vMax = 130, dur = [0.8, 1.4]) {
                for (let i = 0; i < n; i++)
                    P({ x: x + rnd(-spread, spread), y: y + rnd(-spread, spread) * 0.6, vx: rnd(-14, 14), vy: UP() * rnd(vMin, vMax), drag: 0.3,
                        size: rnd(1.5, 3.2), dur: rnd(dur[0], dur[1]), kind: 'glow', color: pick(colors), tw: true });
            }
            function implode(cx, cy, n, r0min, r0max, colors, spinMin, spinMax, rd, dur) {
                for (let i = 0; i < n; i++)
                    P({ orbit: true, cx, cy, a: rnd(0, TAU), r: rnd(r0min, r0max), va: rnd(spinMin, spinMax) * (Math.random() < 0.5 ? 1 : -1), rd,
                        size: rnd(2, 4), dur: dur * rnd(0.8, 1), kind: 'glow', color: pick(colors) });
            }

            // ---------- 칸 단위 이펙트 (강도 낮춤) ----------
            function explosion(x, y, s = 1) {
                flash(x, y, cell * 1.5 * s, C.orange, 0.28, 0.75); ring(x, y, cell * 0.15, cell * 1.3 * s, C.orange, 0.45, 5);
                embers(x, y, Math.round(10 * s), 80 * s, 260 * s, [C.orange, C.yellow, C.red]); puffs(x, y, Math.round(3 * s), C.smoke, 0.45);
            }
            function lightning(x, y) {
                const topY = UP() < 0 ? 0 : H;
                makeBolt(x + rnd(-cell, cell), topY, x, y);
                flash(x, y, cell * 1.2, C.yellow, 0.25, 0.9); ring(x, y, cell * 0.1, cell * 0.8, C.yellow, 0.3, 3);
                embers(x, y, 8, 120, 300, [C.white, C.yellow], 120, { drag: 2.6, dur: rnd(0.3, 0.55), kind: 'spark' });
            }
            function voidHit(x, y) {
                puffs(x, y, 3, C.night, 0.6);
                implode(x, y, 12, cell * 0.8, cell * 1.2, [C.purple, C.violet, C.lilac], 4, 7, 2.8, 0.5);
                flash(x, y, cell * 1.2, C.purple, 0.45, 0.6);
                setTimeout(() => { ring(x, y, cell * 0.1, cell * 1.2, C.purple, 0.4, 4); puffs(x, y, 3, C.violet, 0.55); kick(); }, 320);
            }
            function holy(x, y) {
                beam(x, cell * 1.0, C.gold, 0.65); flash(x, y, cell * 1.3, C.gold, 0.45, 0.7);
                ring(x, y, cell * 0.1, cell * 1.2, C.gold, 0.5, 3); rising(x, y, cell * 0.4, 10, [C.gold, C.white, C.yellow], 50, 130);
            }
            function heal(x, y) {
                flash(x, y, cell * 1.1, C.green, 0.45, 0.45); ring(x, y, cell * 0.15, cell, C.green, 0.5, 3);
                rising(x, y, cell * 0.35, 9, [C.green, C.white, C.gold], 45, 110);
            }
            function hit(sq, cls, s = 1) {
                const { x, y } = ctr(sq);
                switch (cls) {
                    case 'vfx-explosion': explosion(x, y, s); break;
                    case 'vfx-lightning': lightning(x, y); break;
                    case 'vfx-shadow': case 'vfx-void': voidHit(x, y); break;
                    case 'vfx-holy': holy(x, y); break;
                    default: heal(x, y);
                }
                kick();
            }

            // ---------- 보조 이펙트: 효과가 발동한 지점(origin, 보드 % 좌표)을 중심으로 ----------
            function global(name, arg, origin) {
                resize();
                const mx = origin ? origin.x / 100 * W : W / 2, my = origin ? origin.y / 100 * H : H / 2;
                switch (name) {
                    case 'explosion':
                        flash(mx, my, cell * 2.4, C.orange, 0.35, 0.4); ring(mx, my, cell * 0.3, cell * 2.2, C.orange, 0.5, 4);
                        embers(mx, my, 12, 110, 340, [C.orange, C.yellow, C.red], 300, { size: rnd(2, 4) }); break;
                    case 'void':
                        flash(mx, my, cell * 2.6, C.violet, 0.7, 0.35);
                        implode(mx, my, 26, cell * 1.8, cell * 3.2, [C.purple, C.violet, C.lilac], 2.5, 5, 1.9, 0.9);
                        setTimeout(() => { ring(mx, my, cell * 0.2, cell * 2.2, C.purple, 0.5, 4); flash(mx, my, cell * 1.8, C.lilac, 0.3, 0.45); kick(); }, 780); break;
                    case 'heal':
                        flash(mx, my, cell * 2.4, C.green, 0.6, 0.22); ring(mx, my, cell * 0.3, cell * 2, C.green, 0.65, 3, 0.65);
                        for (let i = 0; i < 20; i++) P({ x: mx + rnd(-cell * 2, cell * 2), y: my + DOWN() * rnd(0, cell * 1.4), vx: rnd(-12, 12), vy: UP() * rnd(60, 150), drag: 0.2,
                            size: rnd(1.6, 3.2), dur: rnd(0.8, 1.4), kind: 'glow', color: pick([C.green, C.gold, C.white]), tw: true });
                        break;
                    case 'assassinate': {
                        const Ln = cell * 2.2;
                        for (let i = 0; i < 3; i++) {
                            const ang = -0.9 + i * 0.55, dx = Math.cos(ang) * Ln, dy = Math.sin(ang) * Ln;
                            setTimeout(() => { slash(mx - dx, my - dy, mx + dx, my + dy, i % 2 ? C.white : C.red, 0.3, 6); kick(); }, i * 80);
                        }
                        setTimeout(() => { flash(mx, my, cell * 2.2, C.red, 0.3, 0.3); embers(mx, my, 10, 100, 300, [C.red, C.white], 200); kick(); }, 240); break;
                    }
                    case 'divine':
                        flash(mx, my, cell * 3, C.white, 0.55, 0.4); beam(mx, cell * 1.4, C.gold, 0.75); rayBurst(mx, my, C.gold, 0.75, cell * 3.4);
                        ring(mx, my, cell * 0.3, cell * 2.8, C.gold, 0.65, 4); rising(mx, my, cell * 1.2, 14, [C.gold, C.white, C.yellow], 50, 140); break;
                    case 'wave': wave(arg === 'b' ? 8 : 1); break;
                    case 'blackout': dims.push({ a: 0.55, dur: 0.9, t: 0 }); break;
                    default: flash(mx, my, cell * 2, C.white, 0.4, 0.2);
                }
                kick();
            }

            // ---------- 기물 단위 이펙트 ----------
            function land(sq, color) {
                const { x, y } = ctr(sq); resize();
                ring(x, y, cell * 0.22, cell * 0.78, color === 'w' ? C.white : C.dust, 0.3, 2.5, 0.55);
                for (let i = 0; i < 3; i++) P({ x: x + rnd(-cell * 0.25, cell * 0.25), y: y + DOWN() * cell * 0.3, vx: rnd(-22, 22), vy: UP() * rnd(4, 18),
                    size: rnd(cell * 0.07, cell * 0.12), grow: 1.4, dur: rnd(0.35, 0.55), kind: 'smoke', color: C.dust, alpha: 0.28 });
                kick();
            }
            function shake(px = 3, ms = 240) {
                if (reduceMotion || !boardEl.animate) return;
                const f = [];
                for (let i = 0; i <= 7; i++) { const k = 1 - i / 7; f.push({ translate: `${(rnd(-px, px) * k).toFixed(2)}px ${(rnd(-px, px) * k).toFixed(2)}px` }); }
                boardEl.animate(f, { duration: ms, easing: 'linear' });
            }
            function capture(sq, victim) {
                const { x, y } = ctr(sq); resize();
                const big = victim === 'q' || victim === 'r';
                flash(x, y, cell * (big ? 1.5 : 1.1), C.white, 0.18, 0.7);
                ring(x, y, cell * 0.15, cell * (big ? 1.5 : 1.1), C.yellow, 0.4, big ? 5 : 3);
                embers(x, y, big ? 10 : 6, 90, 240, [C.white, C.yellow, C.orange], 220, { kind: 'spark' });
                shake(big ? 5 : 2.5, big ? 280 : 200);
                kick();
            }
            function shatter(sq, color) {
                if (!sq || reduceMotion) return;
                const { x, y } = ctr(sq); resize();
                const fill = color === 'w' ? [245, 245, 248] : color === 'b' ? [32, 32, 40] : C.brick;
                const edge = color === 'w' ? [90, 90, 105] : color === 'b' ? [215, 215, 228] : [90, 70, 55];
                for (let i = 0; i < 12; i++) {
                    const ang = rnd(0, TAU), sp = rnd(70, 250);
                    P({ x: x + rnd(-8, 8), y: y + rnd(-8, 8), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp + UP() * rnd(60, 160), g: DOWN() * 520, drag: 0.9,
                        size: rnd(3, 7), rot: rnd(0, TAU), vr: rnd(-12, 12), dur: rnd(0.65, 1.0), kind: 'shard', color: fill, edge: 'rgb(' + rgb(edge) + ')' });
                }
                flash(x, y, cell * 0.9, C.white, 0.16, 0.45);
                kick();
            }

            // ---------- 락온 마커 / 스포트라이트 ----------
            // 증강 대상 칸을 먼저 밝게 비추고(나머지는 어둡게) 모서리 브래킷으로 조여 들어가 '누가 대상인지' 보여준다.
            function mark(squares, color, lead) {
                if (reduceMotion) return;
                squares.slice(0, 16).forEach(sq => { const { x, y } = ctr(sq); marks.push({ x, y, color, lead, dur: lead + 0.75, t: 0 }); });
                kick();
            }
            function dimAlpha(m) {
                const inA = Math.min(1, m.t / 0.15), out = m.t < m.lead ? 1 : Math.max(0, 1 - (m.t - m.lead) / 0.35);
                return 0.3 * inA * out;
            }
            function drawDim() {
                if (!marks.length) return;
                let dA = 0; for (const m of marks) dA = Math.max(dA, dimAlpha(m));
                if (dA <= 0) return;
                ctx.globalCompositeOperation = 'source-over'; ctx.globalAlpha = dA; ctx.fillStyle = 'rgb(6,6,18)'; ctx.fillRect(0, 0, W, H);
                ctx.globalCompositeOperation = 'destination-out'; ctx.globalAlpha = 1;
                for (const m of marks) {
                    if (dimAlpha(m) <= 0) continue;
                    const g = ctx.createRadialGradient(m.x, m.y, cell * 0.3, m.x, m.y, cell * 0.8);
                    g.addColorStop(0, 'rgba(0,0,0,1)'); g.addColorStop(1, 'rgba(0,0,0,0)');
                    ctx.fillStyle = g; ctx.fillRect(m.x - cell, m.y - cell, cell * 2, cell * 2);
                }
                ctx.globalCompositeOperation = 'source-over';
            }
            function drawMark(m) {
                const t = m.t, post = Math.max(0, t - m.lead), c = rgb(m.color);
                const appear = Math.min(1, t / 0.28), e = 1 - Math.pow(1 - appear, 3);
                const s = cell * 0.5 * (1 + 0.9 * (1 - e)) + post * cell * 0.9;
                const a = (t < m.lead ? 0.6 + 0.4 * Math.abs(Math.sin(t * 14)) : Math.max(0, 1 - post / 0.5)) * e;
                if (a <= 0) return;
                ctx.globalAlpha = a * 0.2; ctx.fillStyle = `rgb(${c})`; ctx.fillRect(m.x - cell * 0.5, m.y - cell * 0.5, cell, cell);
                ctx.globalAlpha = a; ctx.strokeStyle = `rgb(${c})`; ctx.lineWidth = 3; ctx.lineCap = 'square';
                const arm = cell * 0.2;
                for (const sx of [-1, 1]) for (const sy of [-1, 1]) {
                    ctx.beginPath(); ctx.moveTo(m.x + sx * s, m.y + sy * (s - arm)); ctx.lineTo(m.x + sx * s, m.y + sy * s); ctx.lineTo(m.x + sx * (s - arm), m.y + sy * s); ctx.stroke();
                }
                ctx.globalAlpha = a * 0.75; ctx.beginPath(); ctx.arc(m.x, m.y, cell * (0.11 + 0.04 * Math.sin(t * 16)), 0, TAU); ctx.stroke();
            }

            // ---------- 파도 ----------
            // toRank 방향(랭크 8 = 보드 좌표계 y=0)으로 물결 띠가 훑고 지나간다. 앞쪽엔 거품 크레스트, 뒤쪽은 점점 옅어지는 물.
            const WAVE_TRAVEL = 1.15, WAVE_LAG = 0.5;
            const waveFrontY = o => o.y0 + (o.y1 - o.y0) * Math.min(1, o.t / o.travel);
            const waveTailY = o => o.y0 + (o.y1 - o.y0) * Math.min(1, Math.max(0, (o.t - o.lag) / o.travel));
            const crestY = (o, x, base) => { const ph = o.t * 8; return base + Math.sin(x / cell * 2.6 + ph) * o.A + Math.sin(x / cell * 5.3 - ph * 1.4) * o.A * 0.35; };
            function wave(toRank) {
                resize(); if (!W) return;
                const up = toRank === 8, A = cell * 0.17, m = A * 2.2;
                waves.push({ up, A, y0: up ? H + m : -m, y1: up ? -m : H + m, travel: WAVE_TRAVEL, lag: WAVE_LAG, dur: WAVE_TRAVEL + WAVE_LAG + 0.1, t: 0 });
                kick();
            }
            function emitWave(o, dt) {
                if (o.t > o.travel) return;
                const fwd = o.up ? -1 : 1, base = waveFrontY(o), n = Math.ceil(dt * 110);
                for (let i = 0; i < n; i++) {
                    const x = rnd(0, W), y = crestY(o, x, base);
                    P({ x, y, vx: rnd(-25, 25), vy: UP() * rnd(40, 140) + fwd * rnd(0, 60), g: DOWN() * 320, drag: 0.6, size: rnd(1.4, 3.4), dur: rnd(0.35, 0.8),
                        kind: 'glow', color: pick([[235, 248, 255], [160, 215, 255], [255, 255, 255]]) });
                }

        function spawnFloatingText(sq, text) {

        function highlightAffected(squares, color, delayOf) {

        function showEndScreen(resultType, reasonStr, opts = {}) {
            if(game.is_game_over) return;

            clearTimeout(botHurryTimer);
            const delay = opts.delay || 0;

            if(!isBotMode && myUid && !statsRecorded) {
                statsRecorded = true;

                else if(resultType === '패배') userProfile.stats.l++;

            const reveal = () => {
                if(!game.is_game_over) return;   // 그 사이 새 게임으로 초기화됐다면 표시하지 않음

        function handlePostMove() {

        function makeBotMove() {

            } else {

            }

        // ==========================================
        // 증강 (Augments) 
        // ==========================================
        const shuffle = arr => arr.slice().sort(() => 0.5 - Math.random());
        function neighborSquares(sq) {
            const f = sq.charCodeAt(0), r = parseInt(sq[1]), res = [];
            for (let df = -1; df <= 1; df++) for (let dr = -1; dr <= 1; dr++) {
                if (!df && !dr) continue; const nf = f + df, nr = r + dr;

            }

        function inEnemyPoison(sq, color) { return activePoison.some(p => p.owner !== color && p.squares.includes(sq)); }
        // 독구름: 킹이 아니고 무적도 아닌 '지대 주인의 적'은 그 칸에 서 있을 수 없다(새로 생성/이동/무적 해제 모두 포함)
        function enforcePoison() {

        }
        const augmentOptionCount = color => 3 + ((jackpotBonus && jackpotBonus[color]) || 0);
        function findSqByUid(uid) {
            if (!uid) return null;
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = game.board()[r][c]; if (p && p.uid === uid) return game.rcToSq(r, c); }
            return null;
        }
        function findKillerSq(m) {
            const uid = lastKiller[m]; if (!uid) return null;
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) { const p = game.board()[r][c]; if (p && p.uid === uid) return game.rcToSq(r, c); }
            return null;
        }
        // 네크로맨서: 폰 절반(반올림)을 희생해 그 자리 중 한 곳에 퀸 소환. 아군 킹이 체크되지 않는 조합만 사용.
        function planNecromancer(m) {
            const pawns = findPieces(m, 'p'); if (!pawns.length) return null;
            const n = Math.max(1, Math.round(pawns.length / 2)), eColor = m === 'w' ? 'b' : 'w';
            for (let attempt = 0; attempt < 24; attempt++) {
                const sac = shuffle(pawns).slice(0, n), saved = sac.map(sq => game.get(sq));
                sac.forEach(sq => game.remove(sq));
                let queenSq = null;
                if (!game.in_check(m)) {
                    for (const q of shuffle(sac)) {
                        game.put({ type: 'q', color: m }, q);
                        const bad = game.in_check(eColor) || game.in_check(m);
                        game.remove(q);
                        if (!bad) { queenSq = q; break; }
                    }
                }
                sac.forEach((sq, i) => game.put(saved[i], sq));
                if (queenSq) return { sac, queenSq };
            }
            return null;
        }
        // 킹을 위협 중인 적 기물 목록: 후보 하나만 남기고 나머지 적 기물은 '중립 블로커'로 바꿔 공격 여부를 판정
        function findCheckers(m) {
            const e = m === 'w' ? 'b' : 'w', kSq = findPieces(m, 'k')[0]; if (!kSq) return [];
            const kr = 8 - parseInt(kSq[1]), kc = kSq.charCodeAt(0) - 97, board = game.board(), res = [];
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                const p = board[r][c]; if (!p || p.color !== e || p.type === 'wall') continue;
                const test = board.map((row, ri) => row.map((q, ci) => (q && q.color === e && !(ri === r && ci === c)) ? { type: 'wall', color: 'none', uid: -1 } : q));
                if (game.isSquareAttacked(kr, kc, e, test)) res.push(game.rcToSq(r, c));
            }
            return res;
        }
        function canMarch(m) {
            const dir = m === 'w' ? 1 : -1, promoRank = m === 'w' ? 8 : 1;
            return findPieces(m, 'p').some(sq => { const r = parseInt(sq[1]), r2 = r + 2 * dir; return r2 >= 1 && r2 <= 8 && r2 !== promoRank && !game.get(sq[0] + (r + dir)) && !game.get(sq[0] + r2); });
        }
        function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
        // 아기는 어떻게 태어나?: 양쪽 클라이언트가 같은 결과를 내도록 시드 기반 난수 사용
        function processBaby() {
            if (!babyEffect) return [];
            if (game.turn() === babyEffect.color) return [];
            const owner = babyEffect.color, born = [];
            babyEffect.remaining--;
            const k = babyEffect.kUid ? findSqByUid(babyEffect.kUid) : findPieces(owner, 'k')[0], q = babyEffect.qUid ? findSqByUid(babyEffect.qUid) : findPieces(owner, 'q')[0];
            if (!k || !q) { babyEffect = null; return born; }   // 축복받은 킹/퀸 중 하나가 사라지면 효과 종료
            if (Math.abs(k.charCodeAt(0) - q.charCodeAt(0)) <= 1 && Math.abs(parseInt(k[1]) - parseInt(q[1])) <= 1) {
                const rand = mulberry32(babyEffect.seed + moveCount * 7919);
                let type = 'p';
                if (rand() < 0.12) { const r2 = rand(); type = r2 < 0.35 ? 'n' : r2 < 0.7 ? 'b' : r2 < 0.92 ? 'r' : 'q'; }
                const lastRank = owner === 'w' ? '8' : '1';
                const cand = getSafeEmptySquares(owner, type).filter(sq => type !== 'p' || sq[1] !== lastRank);
                if (cand.length) { const sq = cand[Math.floor(rand() * cand.length)]; game.put({ type, color: owner }, sq); born.push(sq); }
            }
            if (babyEffect.remaining <= 0) babyEffect = null;
            return born;
        }
        const isFogOn = () => !!(blackout && blackout.duration > 0 && blackout.target === myColor && isGameStarted);
        function updateFog() {
            const on = isFogOn(), lit = new Set(on ? findPieces(myColor) : []);
            squareList.forEach(el => el.classList.toggle('fog', on && !lit.has(el.dataset.square)));
            pieceEls.forEach(el => el.classList.toggle('piece-hidden', on && el.dataset.color !== myColor));
        }

        function findPieces(color, type = null) { let res = []; for(let r=0; r<8; r++) for(let c=0; c<8; c++) { const p = game.board()[r][c]; if(p && p.color === color && (!type || p.type === type)) res.push(game.rcToSq(r,c)); } return res; }
        function findVulnerable(color) { return findPieces(color).filter(sq => { const p = game.get(sq); return p && p.type !== 'k' && !invinciblePieces[p.uid]; }); }
        function getEmptySquares() { let res = []; for(let f=97; f<=104; f++) for(let r=1; r<=8; r++) { const sq = String.fromCharCode(f)+r; if(!game.get(sq)) res.push(sq); } return res; }
        function getAdjEmptySquares(sq) { const res = []; const f=sq.charCodeAt(0), r=parseInt(sq[1]); for(let df=-1; df<=1; df++) for(let dr=-1; dr<=1; dr++) if(!(df===0 && dr===0)) { const c = String.fromCharCode(f+df)+(r+dr); if(game.isValidRC(8-r-dr, f-97+df) && !game.get(c)) res.push(c); } return res; }
        
        function getSafeEmptySquares(color, type) {
            let res = [];
            const eColor = color === 'w' ? 'b' : 'w';
            for(let f=97; f<=104; f++) {
                for(let r=1; r<=8; r++) {
                    const sq = String.fromCharCode(f)+r;
                    if(!game.get(sq)) {
                        game.put({type: type, color: color}, sq);
                        const causesCheck = game.in_check(eColor);
                        game.remove(sq);
                        if(!causesCheck && !inEnemyPoison(sq, color)) res.push(sq);
                    }
                }
            }
            if(res.length === 0) return getEmptySquares();
            return res;
        }

        const pieceValue = { q: 9, r: 5, b: 3, n: 3, p: 1, k: 0 };

        function withSearchState(searchState, callback) {
            const saved = { rootedPieces, invinciblePieces, activeWalls, reversedPawns };
            rootedPieces = searchState.rootedPieces;
            invinciblePieces = searchState.invinciblePieces;
            activeWalls = searchState.activeWalls;
            reversedPawns = searchState.reversedPawns;
            try { return callback(); } finally {
                rootedPieces = saved.rootedPieces;
                invinciblePieces = saved.invinciblePieces;
                activeWalls = saved.activeWalls;
                reversedPawns = saved.reversedPawns;
            }
        }

        function cloneBoard(board) {
            return board.map(row => row.map(cell => cell ? { ...cell } : null));
        }

        function cloneGameState(source) {
            const clone = new CustomChess();
            clone._board = cloneBoard(source.board());
            clone._turn = source.turn();
            clone.castling = { w: { ...source.castling.w }, b: { ...source.castling.b } };
            clone.ep_square = source.ep_square;
            clone.is_game_over = source.is_game_over;
            clone.pieceUidCounter = source.pieceUidCounter;
            return clone;
        }

        function evaluateBoardState(state, perspectiveColor) {
            let score = 0;
            const board = state.board();
            for (let r = 0; r < 8; r++) for (let c = 0; c < 8; c++) {
                const p = board[r][c];
                if (!p || p.type === 'wall') continue;
                const base = pieceValue[p.type] || 0;
                const sign = p.color === perspectiveColor ? 1 : -1;
                score += sign * base * 100;
                if (p.type === 'p') {
                    const forward = p.color === 'w' ? (7 - r) : r;
                    score += sign * forward * 6;
                } else if (p.type !== 'k') {
                    const centerBonus = 4 - (Math.abs(3.5 - r) + Math.abs(3.5 - c)) / 2;
                    score += sign * centerBonus * 12;
                }
            }
            score += state.moves().length * 8 * (state.turn() === perspectiveColor ? 1 : -1);
            return score;
        }

        function minimaxSearch(state, depth, alpha, beta, maximizing, perspectiveColor, searchState) {
            if (depth === 0 || state.game_over()) return evaluateBoardState(state, perspectiveColor);
            return withSearchState(searchState, () => {
                const moves = state.moves();
                if (moves.length === 0) return evaluateBoardState(state, perspectiveColor);
                moves.sort((a, b) => getMoveHeuristic(b) - getMoveHeuristic(a));
                if (maximizing) {
                    let best = -99999;
                    for (const m of moves) {
                        const next = cloneGameState(state);
                        next.move({ from: m.from, to: m.to, promotion: m.promotion ? 'q' : null });
                        const value = minimaxSearch(next, depth - 1, alpha, beta, false, perspectiveColor, searchState);
                        if (value > best) best = value;
                        if (value > alpha) alpha = value;
                        if (beta <= alpha) break;
                    }
                    return best;
                } else {
                    let best = 99999;
                    for (const m of moves) {
                        const next = cloneGameState(state);
                        next.move({ from: m.from, to: m.to, promotion: m.promotion ? 'q' : null });
                        const value = minimaxSearch(next, depth - 1, alpha, beta, true, perspectiveColor, searchState);
                        if (value < best) best = value;
                        if (value < beta) beta = value;
                        if (beta <= alpha) break;
                    }
                    return best;
                }
            });
        }

        function getMoveHeuristic(m) {
            let score = 0;
            if (m.promotion) score += 220;
            if (m.captured) {
                const captured = game.get(m.to);
                const value = captured ? pieceValue[captured.type] || 1 : 1;
                score += value * 130;
            }
            if (m.flags === 'k' || m.flags === 'q') score += 90;
            const file = m.to.charCodeAt(0) - 97;
            const rank = parseInt(m.to[1]) - 1;
            const distCenter = Math.abs(file - 3.5) + Math.abs(rank - 3.5);
            score += Math.max(0, 8 - distCenter * 5);
            return score;
        }

        function selectTopBotMove() {
            const searchState = {
                rootedPieces: { ...rootedPieces },
                invinciblePieces: { ...invinciblePieces },
                activeWalls: activeWalls.map(w => ({ ...w })),
                reversedPawns: { ...reversedPawns }
            };
            const moves = game.moves();
            if (moves.length === 0) return null;
            const sortedMoves = moves.slice().sort((a, b) => getMoveHeuristic(b) - getMoveHeuristic(a));
            const candidates = sortedMoves.length > 20 ? sortedMoves.slice(0, 20) : sortedMoves;
            let bestScore = -99999;
            let bestMoves = [];
            for (const m of candidates) {
                const next = cloneGameState(game);
                next.move({ from: m.from, to: m.to, promotion: m.promotion ? 'q' : null });
                const score = minimaxSearch(next, 3, -99999, 99999, false, game.turn(), searchState);
                if (score > bestScore) { bestScore = score; bestMoves = [m]; }
                else if (score === bestScore) bestMoves.push(m);
            }
            return bestMoves[Math.floor(Math.random() * bestMoves.length)];
        }

        const AUGMENT_POOL = [
            { name: '네크로맨서', icon: '💀', desc: '남은 폰의 {절반}을 희생하여 [퀸] 하나를 폰이 있던 자리 중 한 곳에 [소환]합니다.', globalVfx: 'vfx-global-void', isKillType: false,

              condition: () => getEmptySquares().length > 0,
              apply: (m, e, target) => { const sq = (target && !game.get(target)) ? target : shuffle(getEmptySquares())[0]; game.put({ type: 'wall', color: 'none' }, sq); activeWalls.push({ sq: sq, duration: 10 }); spawnFloatingText(sq, '🧱'); return { t: [sq], vfx: 'vfx-heal', msg: '🧱 차원 장벽이 생성되었습니다!' }; } },
            { name: '자아 분열', icon: '😵‍💫', desc: '다음 {3수} 동안 적 폰들이 방향을 잃어 [반대 방향]으로 이동합니다.', globalVfx: 'vfx-global-void', isKillType: false, condition: (m, e) => findPieces(e, 'p').length > 0,
              apply: (m, e) => { reversedPawns = { color: e, duration: 6 }; return { t: findPieces(e, 'p'), vfx: 'vfx-void', msg: '😵‍💫 적 폰들이 방향 감각을 잃었습니다!' }; } },
            { name: '잭팟', icon: '🎰', desc: '이제부터 자신에게 등장하는 모든 증강 선택지가 {1개} [증가]합니다.', globalVfx: 'vfx-global-heal', isKillType: false, condition: (m) => jackpotBonus[m] < 2,
              apply: (m, e) => { jackpotBonus[m] = (jackpotBonus[m] || 0) + 1; const k = findPieces(m, 'k')[0]; if (k) spawnFloatingText(k, '🎰'); return { t: [], vfx: '', origin: k || null, msg: '🎰 잭팟! 앞으로 증강 선택지가 하나 더 늘어납니다.' }; } },
            { name: '아기는 어떻게 태어나?', icon: '🦢', desc: '{5수} 동안 아군 킹과 퀸에게 [축복]이 적용되며, 두 기물이 인접해 있을 경우 매 수 무작위 빈칸에 새로운 폰을 [생성]합니다. 낮은 확률로 가치가 높은 기물이 등장합니다.', globalVfx: 'vfx-global-heal', isKillType: false,
              condition: (m) => !babyEffect && findPieces(m, 'k').length > 0 && findPieces(m, 'q').length > 0,
              apply: (m, e) => { const k = findPieces(m, 'k')[0], q = findPieces(m, 'q')[0];
                  babyEffect = { color: m, remaining: 5, seed: Math.floor(Math.random() * 1e9), kUid: game.get(k).uid, qUid: game.get(q).uid };
                  [k, q].forEach(sq => spawnFloatingText(sq, '🦢'));
                  return { t: [k, q], vfx: 'vfx-heal', msg: '🦢 왕과 왕비에게 축복이 내려졌습니다!' }; } },
            { name: '암전', icon: '💡', weight: 1, desc: '{2수} 동안 상대방의 기물들이 차지한 칸을 제외한 모든 칸을 [암전]시켜 시야를 방해합니다.', globalVfx: 'vfx-global-blackout', isKillType: false,
              condition: (m, e) => !blackout && !(isBotMode && m === myColor),
              apply: (m, e) => { blackout = { target: e, duration: 4 }; return { t: [], vfx: '', msg: '💡 상대의 시야가 어둠에 잠겼습니다!' }; } }
        ];

        const AUGMENT_META = {
            '네크로맨서': { category: '소환', risk: '자기 희생' }, '신의 심판': { category: '피해', risk: '아군도 피해 가능' }, '벼락': { category: '피해' },
            '독구름': { category: '피해' }, '연계 분쇄': { category: '피해' }, '암살': { category: '피해' }, '흑사': { category: '피해' }, '복수': { category: '피해' }, '신성한 폭발': { category: '피해' },
            '징집': { category: '소환' }, '축복': { category: '소환' }, '숲의 망령': { category: '소환' }, '아기는 어떻게 태어나?': { category: '소환' },
            '기사 서임': { category: '유틸' }, '프로모션': { category: '유틸' }, '캐슬링+': { category: '유틸' }, '진군 명령': { category: '유틸' }, '그림자 교체': { category: '유틸' },
            '저주': { category: '유틸' }, '혼란': { category: '유틸' }, '광기': { category: '유틸', risk: '대상 지정' }, '강제 이주': { category: '유틸' }, '파도': { category: '유틸' },
            '덩굴': { category: '유틸' }, '빛의 수호': { category: '유틸' }, '여신의 가호': { category: '유틸' }, '마인드 컨트롤': { category: '유틸' },
            '차원 장벽': { category: '유틸', risk: '위치 지정' }, '자아 분열': { category: '유틸' }, '잭팟': { category: '유틸' }, '암전': { category: '유틸' }
        };

        function getAugmentCategoryLabel(aug) {
            return AUGMENT_META[aug.name]?.category || '기타';
        }

        function getAugmentCategoryClass(aug) {
            const category = getAugmentCategoryLabel(aug);
            if (category === '피해') return 'augment-type-damage';
            if (category === '소환') return 'augment-type-summon';
            if (category === '유틸') return 'augment-type-utility';
            return 'augment-type-other';
        }

        function getAugmentRiskLabel(aug) {
            return AUGMENT_META[aug.name]?.risk || '';
        }

        // 설명 마크업: {범위/수량} → 유형 색(진하게), [효과/동작] → 유형 색(연하게)
        function renderAugDesc(desc) {
            return String(desc).replace(/&/g, '&amp;').replace(/</g, '&lt;')
                .replace(/\{([^}]+)\}/g, '<span class="hl-q">$1</span>').replace(/\[([^\]]+)\]/g, '<span class="hl-e">$1</span>');
        }
        let selectedAugmentIdx = -1;
        let opponentAugmentPreview = null;
        let opponentAugmentPreviewColor = null;
        let activeAugmentOptions = null;
        let activeAugmentPlayerColor = null;

        function buildAugmentPreviewPayload(options) {
            return options.map(aug => ({
                name: aug.name,
                icon: aug.icon,
                desc: aug.desc,
                category: getAugmentCategoryLabel(aug),
                risk: getAugmentRiskLabel(aug),
                typeClass: getAugmentCategoryClass(aug)
            }));
        }

        function resolveAugmentOptions(options) {
            if (!options) return [];
            return options.map(opt => {
                if (opt && typeof opt.apply === 'function') return opt;
                const found = AUGMENT_POOL.find(a => a.name === opt.name);
                return found || opt;
            });
        }

        function renderOpponentPreviewCards(previewOptions, playerColor, overlay) {
            let html = `<div class="turn-badge ${playerColor==='w'?'white':'black'}">상대방 선택 중...</div><h2>적 선택 중</h2><p style="color:#ccc; margin-bottom:12px; font-size:0.95rem;">상대가 볼 수 있는 선택지입니다.</p><div class="cards-container cards-n${previewOptions.length}">`;
            previewOptions.forEach((aug) => {
                html += `<div class="augment-card ${aug.typeClass} dimmed"><div class="augment-icon">${aug.icon}</div><div class="augment-title">${aug.name}</div><div class="augment-subtitle"><span class="aug-type">${aug.category}</span>${aug.risk ? `<span class="aug-risk">${aug.risk}</span>` : ''}</div><div class="augment-desc">${renderAugDesc(aug.desc)}</div></div>`;
            });
            html += `</div>`;
            overlay.innerHTML = html;
            overlay.style.display = 'flex';
        }

        function processNextAugmentPhase() {
            opponentAugmentPreview = null;
            opponentAugmentPreviewColor = null;
            if (pendingAugments.length === 0) { 
                isSystemLocked = false; updateCheckStatus(); updateProgressBar(); 
                if(isBotMode && game.turn() === 'b' && !game.game_over()) setTimeout(makeBotMove, 800);
                else startHurryTimer();
                return; 
            }
            isSystemLocked = true; const activeColor = pendingAugments.shift(); 
            selectedAugmentIdx = -1;
            showAugmentCards(activeColor);
        }

        function showCastText(text, callback) {
            const el = document.getElementById('cast-text');
            el.innerHTML = ''; el.style.fontSize = '';
            const span = document.createElement('span'); span.style.cssText = 'display:inline-block;white-space:nowrap;'; span.innerText = `${text} 발동!`; el.appendChild(span);
            el.style.display = 'block';
            const basePx = parseFloat(getComputedStyle(el).fontSize), maxW = window.innerWidth * 0.8;   // 애니메이션 최대 확대(1.1배)까지 화면 안에 들어오도록
            if (span.offsetWidth > maxW) el.style.fontSize = Math.max(13, basePx * maxW / span.offsetWidth) + 'px';
            el.classList.remove('cast-anim'); void el.offsetWidth; el.classList.add('cast-anim'); setTimeout(() => { el.style.display = 'none'; callback(); }, 1200);
        }

        function showAugmentCards(playerColor, options = null) {
            const overlay = document.getElementById('augment-overlay');
            const isRestore = !options && activeAugmentOptions && activeAugmentPlayerColor === playerColor;
            if (!options && isRestore) {
                options = activeAugmentOptions;
            }
            if (playerColor !== myColor) {
                if (isBotMode) {
                    const enemyColor = playerColor === 'w' ? 'b' : 'w';
                    let available = AUGMENT_POOL.filter(aug => aug.condition(playerColor, enemyColor));
                    if(available.length === 0) { processNextAugmentPhase(); return; }
                    const choice = available[Math.floor(Math.random() * available.length)];
                    setTimeout(() => applySelectedAugment(choice, playerColor, enemyColor), 1500); 
                    return;
                }
                if (opponentAugmentPreview && opponentAugmentPreviewColor === playerColor) {
                    renderOpponentPreviewCards(opponentAugmentPreview, playerColor, overlay);
                    return;
                }
                if (currentRoomId) {
                    overlay.innerHTML = `<div class="turn-badge ${playerColor==='w'?'white':'black'}">상대방 선택 중...</div><h2>적 선택 중</h2><p style="color:#ccc; margin-bottom:12px; font-size:0.95rem;">상대 선택지를 불러오는 중입니다...</p>`;
                    overlay.style.display = 'flex';
                    return;
                }
                const enemyColor = playerColor === 'w' ? 'b' : 'w';
                let available = AUGMENT_POOL.filter(aug => aug.condition(playerColor, enemyColor));
                let weighted = [];
                available.forEach(aug => {
                    let w = aug.weight !== undefined ? aug.weight : (aug.isKillType ? 1 : 4);
                    for (let i = 0; i < w; i++) weighted.push(aug);
                });
                weighted.sort(() => 0.5 - Math.random());
                const previewOptions = [];
                for (let aug of weighted) {
                    if (previewOptions.length >= augmentOptionCount(playerColor)) break;
                    if (!previewOptions.find(o => o.name === aug.name)) previewOptions.push(aug);
                }
                if (previewOptions.length === 0) { processNextAugmentPhase(); return; }
                renderOpponentPreviewCards(previewOptions, playerColor, overlay);
                return; 
            }

            const enemyColor = playerColor === 'w' ? 'b' : 'w';
            const resolvedOptions = options ? resolveAugmentOptions(options) : [];
            let available = resolvedOptions.length > 0 ? resolvedOptions : AUGMENT_POOL.filter(aug => aug.condition(playerColor, enemyColor));

            if (!options) {
                let weighted = [];
                available.forEach(aug => {
                    let w = aug.weight !== undefined ? aug.weight : (aug.isKillType ? 1 : 4);
                    for(let i=0; i<w; i++) weighted.push(aug);
                });
                weighted.sort(() => 0.5 - Math.random()); 
                options = [];
                for(let a of weighted) { if(options.length<augmentOptionCount(playerColor) && !options.find(o=>o.name===a.name)) options.push(a); }
            } else {
                options = resolveAugmentOptions(options);
            }

            if(options.length === 0) { processNextAugmentPhase(); return; }

            const colorName = playerColor === 'w' ? '백' : '흑'; const badgeClass = playerColor === 'w' ? 'white' : 'black';
            let html = `<div class="turn-badge ${badgeClass}">${colorName} 차례</div><h2>증강 선택</h2><div class="cards-container cards-n${options.length}">`;
            const previewPayload = buildAugmentPreviewPayload(options);
            if (currentRoomId && !isBotMode && !isRestore) {
                pushGameAction({ type: 'augment_preview', playerColor: playerColor, preview: previewPayload });
                activeAugmentOptions = previewPayload;
                activeAugmentPlayerColor = playerColor;
                saveRoomSession({ activeAugmentOptions: previewPayload, activeAugmentPlayerColor: playerColor });
                persistRoomGameState().catch(() => {});
            }
            if (currentRoomId && !isBotMode && isRestore) {
                activeAugmentOptions = previewPayload;
                activeAugmentPlayerColor = playerColor;
                saveRoomSession({ activeAugmentOptions: previewPayload, activeAugmentPlayerColor: playerColor });
            }
            options.forEach((aug, idx) => {
                const typeLabel = getAugmentCategoryLabel(aug);
                const riskLabel = getAugmentRiskLabel(aug);
                const typeClass = getAugmentCategoryClass(aug);
                html += `<div class="augment-card ${typeClass}" data-idx="${idx}"><div class="augment-icon">${aug.icon}</div><div class="augment-title">${aug.name}</div><div class="augment-subtitle"><span class="aug-type">${typeLabel}</span>${riskLabel ? `<span class="aug-risk">${riskLabel}</span>` : ''}</div><div class="augment-desc">${renderAugDesc(aug.desc)}</div></div>`;
            });
            html += `</div><div class="augment-hint">카드 바깥쪽을 눌러 필드를 확인하세요.</div>`;
            overlay.innerHTML = html; overlay.style.display = 'flex';

            document.querySelectorAll('.augment-card').forEach((card, idx) => {
                card.onclick = () => {
                    if (selectedAugmentIdx === idx) {
                        overlay.style.display = 'none';
                        applySelectedAugment(resolveAugmentOptions(options)[idx], playerColor, enemyColor, () => showAugmentCards(playerColor, options));
                    } else {
                        selectedAugmentIdx = idx;
                        document.querySelectorAll('.augment-card').forEach(c => c.classList.remove('selected')); card.classList.add('selected');
                        showToast("한 번 더 눌러 발동하세요.", "var(--primary)", 1500);
                    }
                };
            });

            // 재접속 시 선택 상태 복원
            if (selectedAugmentIdx !== -1 && selectedAugmentIdx < options.length) {
                const selectedCard = document.querySelector(`.augment-card[data-idx="${selectedAugmentIdx}"]`);
                if (selectedCard) {
                    selectedCard.classList.add('selected');
                }
            }
        }

        function applySelectedAugment(selectedAug, pColor, eColor, onCancel) {
            if (selectedAug.target && pColor === myColor) {
                beginTargeting(selectedAug, pColor, eColor, target => doApplyAugment(selectedAug, pColor, eColor, target), onCancel);
                return;
            }
            doApplyAugment(selectedAug, pColor, eColor, null);
        }

        function doApplyAugment(selectedAug, pColor, eColor, target) {
            activeAugmentOptions = null;
            activeAugmentPlayerColor = null;
            selectedAugmentIdx = -1;
            persistRoomGameState().catch(() => {});
            showCastText(selectedAug.name, () => {
                floatLog = [];
                let res;
                try { res = selectedAug.apply(pColor, eColor, target); const poisoned = enforcePoison(); if (poisoned.length) res.t = [...new Set([...(res.t || []), ...poisoned])]; }
                finally { var floats = floatLog; floatLog = null; }

                pushGameAction({
                    type: 'augment_sync', name: selectedAug.name, state: serializeGameState(),
                    globalVfx: selectedAug.globalVfx || null,
                    t: res.t || [], vfx: res.vfx || '', msg: res.msg || '', delay: selectedAug.delay || 1200, floats: floats, fxArg: res.fxArg || null, origin: res.origin || null
                });

                const lead = playAugmentVisuals({ name: selectedAug.name, globalVfx: selectedAug.globalVfx, t: res.t, vfx: res.vfx, floats: floats, fxArg: res.fxArg, origin: res.origin });
                playSFX('augment');
                showToast(res.msg, "var(--primary)", 4000);
                persistRoomGameState().catch(() => {});

                if (isBotMode && selectedAug.isKillType && res.t && res.t.length > 0) {
                    scheduleBotReply(pColor === myColor ? getBotSpeech('augment') : getBotSpeech('capture'), 1500);
                }

                const waitTime = (selectedAug.delay || 1200) + lead;
                setTimeout(() => { if(!game.game_over()) processNextAugmentPhase(); }, waitTime);
            });
        }

        // ---- 위치 / 개체 지정: 한 번 탭하면 미리보기, 같은 곳을 한 번 더 탭하면 확정 ----
        function ensureTargetBanner() {
            let b = document.getElementById('target-banner');
            if (!b) {
                b = document.createElement('div'); b.id = 'target-banner';
                b.innerHTML = '<div class="tb-text"><div class="tb-title"></div><div class="tb-msg"></div></div><button class="tb-cancel" type="button">취소</button>';
                document.body.appendChild(b);
                b.querySelector('.tb-cancel').addEventListener('click', () => cancelTargeting());
            }
            return b;
        }
        function setTargetBanner(title, msg, confirm) {
            const b = ensureTargetBanner();
            b.querySelector('.tb-title').innerText = title; b.querySelector('.tb-msg').innerText = msg;
            b.classList.toggle('confirm', !!confirm); b.style.display = 'flex';
        }
        function clearTargetVisuals() {
            squareList.forEach(el => el.classList.remove('target-valid', 'tv-piece', 'target-preview'));
            document.querySelectorAll('.target-ghost').forEach(e => e.remove());
            const b = document.getElementById('target-banner'); if (b) b.style.display = 'none';
        }
        function beginTargeting(aug, pColor, eColor, onConfirm, onCancel) {
            const def = aug.target, valid = def.valid(pColor, eColor);
            if (!valid.length) { onConfirm(null); return; }
            targeting = { aug, valid: new Set(valid), preview: null, onConfirm, onCancel };
            valid.forEach(sq => { const el = squareEls.get(sq); if (el) { el.classList.add('target-valid'); if (def.mode === 'piece') el.classList.add('tv-piece'); } });
            setTargetBanner(`${aug.icon} ${aug.name}`, def.prompt, false);
        }
        function handleTargetClick(sq) {
            if (!targeting) return;
            if (!targeting.valid.has(sq)) { showToast('지정할 수 없는 곳입니다.', 'var(--danger)', 1200); return; }
            if (targeting.preview === sq) { confirmTarget(); return; }
            squareList.forEach(el => el.classList.remove('target-preview'));
            document.querySelectorAll('.target-ghost').forEach(e => e.remove());
            targeting.preview = sq; squareEls.get(sq).classList.add('target-preview');
            if (targeting.aug.target.ghost === 'wall') {
                const c = getCoords(sq), g = document.createElement('div');
                g.className = 'piece-wrapper target-ghost'; g.innerHTML = svgPieces['WALL']; g.style.translate = `${c.x * 8}% ${c.y * 8}%`; piecesLayer.appendChild(g);
            }
            setTargetBanner(`${targeting.aug.icon} ${targeting.aug.name}`, '한 번 더 누르면 확정됩니다', true);
        }
        function confirmTarget() {
            const t = targeting; if (!t || !t.preview) return;
            const sq = t.preview; clearTargetVisuals(); targeting = null; t.onConfirm(sq);
        }
        function cancelTargeting() {
            const t = targeting; clearTargetVisuals(); targeting = null;
            if (t && t.onCancel) t.onCancel();
        }

        initBoard();
    </script>
</body>
</html>
